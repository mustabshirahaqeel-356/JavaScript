
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coffee & Drinks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Coffee & Drinks</h1>
        <p>A little collection of refreshing favourites.</p>
    </header>

    <main>

        <section class="explorer">

            <input
                type="text"
                id="search"
                placeholder="Search for a drink..."
            >

            <div class="categories">
                <button class="active" data-category="All">All</button>
                <button data-category="Hot Tea">Hot Tea</button>
                <button data-category="Coffee">Coffee</button>
                <button data-category="Cold Coffee">Cold Coffee</button>
                <button data-category="Cold Drink">Cold Drink</button>
            </div>

            <p id="count"></p>

        </section>

        <div id="list"></div>

    </main>

    <script src="app.js" defer></script>

</body>
</html>
